services:
  api:
    build: .
    image: secure-task-api:local
    env_file: .env            # copy .env.example to .env and fill in real values
    environment:
      DATABASE_URL: sqlite:////data/tasks.db
    ports:
      - "127.0.0.1:8000:8000"  # localhost only; put a TLS reverse proxy in front for real deployments
    volumes:
      - task-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

volumes:
  task-data:
